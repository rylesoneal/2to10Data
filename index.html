<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scorecard View</title>
    <!-- This meta tag will refresh the entire page every 5 seconds -->
    <meta http-equiv="refresh" content="5">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f0f0;
        }
        iframe {
            width: 100vw; /* 100% of viewport width */
            height: 100vh; /* 100% of viewport height */
            border: none;
            display: block;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>
    <iframe src="https://docs.google.com/spreadsheets/d/1cLX0FXqUm7Eun-xEvHa-4EZz4-BHt4NnbgqskL2oxsg/htmlembed?gid=0&single=true&range=A1:P20&widget=false&headers=false&chrome=false"></iframe>
</body>

</html>
